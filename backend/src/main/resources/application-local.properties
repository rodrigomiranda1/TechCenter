# Credenciales locales usadas para la V2 academica de TechCenter.
# IMPORTANTE: no subir este archivo a repositorios publicos.

# Twilio Verify
TWILIO_ENABLED=true
TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:tu_twilio_account_sid_aqui}
TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:tu_twilio_auth_token_aqui}
TWILIO_VERIFY_SERVICE_SID=${TWILIO_VERIFY_SERVICE_SID:tu_verify_service_sid_aqui}
TWILIO_VERIFY_CHANNEL=sms

ferremax.integraciones.twilio.enabled=true
ferremax.integraciones.twilio.account-sid=${TWILIO_ACCOUNT_SID}
ferremax.integraciones.twilio.auth-token=${TWILIO_AUTH_TOKEN}
ferremax.integraciones.twilio.verify-service-sid=${TWILIO_VERIFY_SERVICE_SID}
ferremax.integraciones.twilio.channel=${TWILIO_VERIFY_CHANNEL}

# Mercado Pago sandbox
MERCADO_PAGO_ENABLED=true
MERCADO_PAGO_ACCESS_TOKEN=${MERCADO_PAGO_ACCESS_TOKEN:tu_mp_access_token_aqui}
MERCADO_PAGO_PUBLIC_KEY=${MERCADO_PAGO_PUBLIC_KEY:tu_mp_public_key_aqui}

ferremax.integraciones.mercadopago.enabled=true
ferremax.integraciones.mercadopago.access-token=${MERCADO_PAGO_ACCESS_TOKEN}
ferremax.integraciones.mercadopago.public-key=${MERCADO_PAGO_PUBLIC_KEY}
ferremax.integraciones.mercadopago.sandbox=true

# Google OAuth2
GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:tu_google_client_id_aqui}
GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:tu_google_client_secret_aqui}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}