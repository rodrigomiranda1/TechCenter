spring.application.name=TechCenter

# MYSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/bd_tienda_componentes?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:mysql}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA - HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# IA opcional. Si no hay servicio externo configurado, el sistema responde con el catalogo local.
ferremax.ai.provider=local
ferremax.ai.ollama-url=http://localhost:11434

# Integraciones V2. Configurar por variables de entorno o application-local.properties no versionado.
techcenter.negocio.nombre=TechCenter Peru SAC
techcenter.negocio.ruc=20609876543
techcenter.negocio.direccion=Av. Los Constructores 245, Santiago de Surco, Lima
ferremax.comprobantes.serie-boleta=B001
ferremax.comprobantes.serie-factura=F001
ferremax.integraciones.twilio.enabled=${TWILIO_ENABLED:false}
ferremax.integraciones.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
ferremax.integraciones.twilio.auth-token=${TWILIO_TOKEN:}
ferremax.integraciones.twilio.verify-service-sid=${TWILIO_VERIFY_SERVICE_SID:}
ferremax.integraciones.twilio.channel=${TWILIO_VERIFY_CHANNEL:sms}
ferremax.integraciones.mercadopago.enabled=${MERCADO_PAGO_ENABLED:false}
ferremax.integraciones.mercadopago.access-token=${MERCADO_PAGO_ACCESS_TOKEN:}
ferremax.integraciones.mercadopago.public-key=${MERCADO_PAGO_PUBLIC_KEY:}
ferremax.integraciones.mercadopago.sandbox=true

# GOOGLE OAUTH2 (Se colocan fallbacks ficticios si las variables de entorno están vacías para evitar fallos de bean)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dev-client-id.apps.googleusercontent.com}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dev-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,email,profile