version: '3.8'

services:
  # 1. Base de Datos MySQL
  mysqldb:
    image: mysql:8.0
    container_name: techcenter-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: mysql
      MYSQL_DATABASE: techcenter_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      #mapear el init.sql para cargar INSERTS
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  # 2. Backend Spring Boot
  backend:
    build: ./backend
    container_name: techcenter-backend
    restart: always
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/techcenter_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: mysql
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.MySQLDialect
    depends_on:
      - mysqldb

  # 3. Frontend Angular
  frontend:
    build: ./frontend
    container_name: techcenter-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db_data: